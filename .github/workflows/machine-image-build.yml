name: Build and Share Machine Images

on:
  pull_request:
    branches:
      - main

jobs:
  machine_image_build:
    name: Build and Share Machine Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.8.5"

      # Initialize Packer plugins - this is the key addition
      - name: Initialize Packer Plugins
        run: |
          cd infra/packer
          packer init packer.pkr.hcl

      - name: Validate Packer template
        run: |
          cd infra/packer
          packer validate packer.pkr.hcl

      - name: Setup application artifacts
        run: |
          # Create a temporary directory for zip creation
          mkdir -p /tmp/webapp-build

          # Copy all application files to the temporary directory
          cp -r models utils routes config controllers *.js package.json /tmp/webapp-build/

          # Navigate to the temporary directory and create the zip
          cd /tmp/webapp-build
          zip -r /tmp/application.zip .

          #{db_host} should point to the RDS instance
          echo "DB_HOST=${db_host}" > /tmp/.env  
          echo "DB_PORT=3306" >> /tmp/.env
          echo "DB_USER=csye6225" >> /tmp/.env
          echo "DB_PASSWORD=${db_password}" >> /tmp/.env
          echo "DB_NAME=csye6225" >> /tmp/.env
          echo "AWS_REGION=us-east-1" >> /tmp/.env
          echo "S3_BUCKET=${s3_bucket}" >> /tmp/.env
          echo "PORT=8080" >> /tmp/.env
          echo "NODE_ENV=production" >> /tmp/.env

          chmod 644 /tmp/application.zip /tmp/.env

          # Verify files exist
          ls -la /tmp/application.zip
          ls -la /tmp/.env

          unzip -l /tmp/application.zip

      # Configure AWS DEV Credentials
      - name: Configure AWS DEV Credentials
        run: |
          echo "Setting up AWS DEV credentials..."
          echo "AWS_ACCESS_KEY_ID=${{ secrets.DEV_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      # Build AMI in DEV account only
      - name: Build Machine Image in DEV account
        run: |
          cd infra/packer
          packer build -var "vpc_identifier=${{ secrets.VPC_IDENTIFIER_DEV }}" \
             -var "subnet_identifier=${{ secrets.SUBNET_IDENTIFIER_DEV }}" \
             -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID_PKR }}" \
             -var "db_host=${{ secrets.DB_HOST }}" \
             -var "db_password=${{ secrets.DB_PASSWORD }}" \
             -var "s3_bucket=${{ secrets.S3_BUCKET }}" \
             -only=amazon-ebs.ubuntu_image \
             packer.pkr.hcl

      # Share AMI with DEMO account
      - name: Share AMI with DEMO account
        env:
          DEV_AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          DEV_AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          DEMO_AWS_ACCESS_KEY_ID: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          DEMO_AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          DEMO_ACCOUNT_ID_PKR: ${{ secrets.DEMO_ACCOUNT_ID_PKR }}
        run: |
          cd infra/packer
          chmod +x ami_migration.sh
          ./ami_migration.sh
