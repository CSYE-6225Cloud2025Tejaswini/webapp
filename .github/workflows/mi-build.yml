name: Build and Share Machine Images

on:
  pull_request:
    branches:
      - main

# Only run if the PR is merged
jobs:
  machine_image_build:
    name: Build and Share Machine Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.8.5"

      # Initialize Packer plugins - this is the key addition
      - name: Initialize Packer Plugins
        run: |
          cd infra/packer
          packer init ubuntu-packer.pkr.hcl

      - name: Validate Packer template
        run: |
          cd infra/packer
          packer validate ubuntu-packer.pkr.hcl

      - name: Setup application artifacts
        run: |
          # Create dummy files for the application
          mkdir -p /tmp/webapp
          echo "console.log('Health check OK');" > /tmp/webapp/server.js
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" > /tmp/.env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> /tmp/.env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> /tmp/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> /tmp/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> /tmp/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> /tmp/.env
          echo "PORT=${{ secrets.PORT }}" >> /tmp/.env
          cd /tmp
          zip -r application.zip webapp/
          mv application.zip $GITHUB_WORKSPACE/
          cp /tmp/.env $GITHUB_WORKSPACE/

      # Configure AWS DEV Credentials
      - name: Configure AWS DEV Credentials
        run: |
          echo "Setting up AWS DEV credentials..."
          echo "AWS_ACCESS_KEY_ID=${{ secrets.DEV_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      # Build AMI in DEV account only
      - name: Build Machine Image in DEV account
        run: |
          cd infra/packer
          packer build -var "vpc_identifier=${{ secrets.VPC_IDENTIFIER_DEV }}" \
                       -var "subnet_identifier=${{ secrets.SUBNET_IDENTIFIER_DEV }}" \
                       -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
                       -only=amazon-ebs.ubuntu_image \
                       packer-ubuntu.pkr.hcl

      # Configure GCP DEV Credentials
      - name: Setup GCP DEV Credentials
        run: |
          echo "Setting up GCP DEV credentials..."
          echo '${{ secrets.GCP_DEV_CREDENTIALS }}' > gcp-dev-credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-dev-credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-dev-credentials.json" >> $GITHUB_ENV

      # Build GCP Image in DEV project
      - name: Build GCP Image in DEV project
        run: |
          cd infra/packer
          packer build -only=googlecompute.ubuntu ubuntu-packer.pkr.hcl

      # Setup DEMO Environment Credentials
      - name: Setup DEMO Credentials
        run: |
          echo "Setting up GCP DEMO credentials..."
          echo '${{ secrets.GCP_DEMO_CREDENTIALS }}' > gcp-demo-credentials.json
          chmod 600 gcp-dev-credentials.json gcp-demo-credentials.json

      # Share AMI with DEMO account
      - name: Share AMI with DEMO account
        env:
          DEV_AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          DEV_AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          DEMO_AWS_ACCESS_KEY_ID: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          DEMO_AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          DEMO_ACCOUNT_ID: ${{ secrets.DEMO_ACCOUNT_ID }}
        run: |
          cd infra/packer
          chmod +x AWS_AMI.sh
          ./AWS_AMI.sh

      # Share GCP Image with DEMO project
      - name: Share GCP Image with DEMO project
        run: |
          cd infra/packer
          chmod +x migration_GCP.sh
          ./migration_GCP.sh

      # Clean up credentials
      - name: Clean Up Credentials
        if: always()
        run: |
          rm -f gcp-dev-credentials.json gcp-demo-credentials.json

