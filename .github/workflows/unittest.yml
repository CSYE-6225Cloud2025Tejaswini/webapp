name: Unit test Webapp

on:
  pull_request:
    branches:
      - main   # Trigger workflow on pull requests to main branch

jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    services:
      mysql:
        image: mysql:8.0  # Start MySQL 8.0 as a service container
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-   # Configure health check for MySQL
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4   # Checkout the code from the PR

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"   # Use Node.js 20
          cache: "npm"   # Cache dependencies to speed up workflow


      - name: Verify MySQL Connection
        run: |
          sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -P 3306 -u test_user -ptest_password -e "SHOW DATABASES;"

      - name: Create `.env` File
        run: |
          cat <<EOF > .env
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_NAME=test_db
          PORT=3000
          NODE_ENV=test
          EOF
      
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install Project Dependencies
        run: npm install  # Install dependencies using clean install for reproducibility

      - name: Run Tests
        run: npm test # Run unit tests
        env: # Ensure test environment variables are available to the test process
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
          NODE_ENV: test
